name: Engine CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@6
        with:
          dotnet-version: 8.0.x

      - name: Setup uv
        uses: astral-sh/setup-uv@v8

      - name: Verify tools
        shell: pwsh
        run: |
          dotnet --version
          uv --version
          clang-format --version
          clang-tidy --version

      - name: Restore .NET
        run: dotnet restore Castor-Engine.sln

      - name: Run pre-commit checks
        run: uvx pre-commit run --all-files --show-diff-on-failure

  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@6
        with:
          dotnet-version: 8.0.x

      - name: Configure engine
        run: cmake --preset windows-x64

      - name: Build engine
        run: cmake --build --preset windows-x64-release

      - name: Install engine
        run: >
          cmake --install build/windows-x64
          --config Release
          --prefix artifacts/runtime/win-x64

      - name: Restore .NET
        run: dotnet restore Castor-Engine.sln

      - name: Build .NET
        run: >
          dotnet build Castor-Engine.sln
          --configuration Release
          --no-restore

      - name: Test .NET
        run: >
          dotnet test Castor-Engine.sln
          --configuration Release
          --no-build
