name: Test OBS SDK Bootstrap

on:
  workflow_dispatch:

  push:
    branches:
      - build/obs-sdk-bootstrap
    paths:
      - .github/workflows/test-obs-sdk-bootstrap.yml
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/dependencies/**
      - Castor.Engine.Host/**
      - Castor.Engine/**
      - Castor.Engine.Tests/**

permissions:
  actions: read
  contents: read

jobs:
  bootstrap-and-build:
    name: Bootstrap and build Windows x64
    runs-on: windows-2022

    env:
      OBS_SDK_ARTIFACT_RUN_ID: "30120019892"
      OBS_SDK_SHA256: de479a1d3b978456871d6b57fa859178b0af35ba1bbbb077854439cdb304ebd9

    steps:
      - name: Checkout Castor Engine
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Download exact Castor OBS SDK artifact
        uses: actions/download-artifact@v7
        with:
          name: castor-obs-sdk-32.1.2-win-x64
          path: artifacts/obs-sdk-input
          github-token: ${{ github.token }}
          repository: Castor-Studio/Castor-Engine
          run-id: ${{ env.OBS_SDK_ARTIFACT_RUN_ID }}

      - name: Validate exact Castor OBS SDK archive
        id: sdk
        shell: pwsh
        run: |
          $archive = Get-ChildItem `
            -LiteralPath "artifacts/obs-sdk-input" `
            -Filter "Castor.Obs.Sdk.win-x64-32.1.2-castor.1.zip" |
            Select-Object -First 1

          if ($null -eq $archive) {
            throw "The expected Castor OBS SDK archive was not downloaded."
          }

          $checksumFile = "$($archive.FullName).sha256"

          if (!(Test-Path -LiteralPath $checksumFile -PathType Leaf)) {
            throw "The SDK checksum file was not downloaded: $checksumFile"
          }

          $publishedHash = (
            Get-Content -LiteralPath $checksumFile -Raw
          ).Split(
            [char[]] " `t`r`n",
            [System.StringSplitOptions]::RemoveEmptyEntries
          )[0].ToLowerInvariant()

          $actualHash = (
            Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          if ($publishedHash -ne $actualHash) {
            throw "The published checksum does not match the SDK archive."
          }

          if ($actualHash -ne $env:OBS_SDK_SHA256) {
            throw "Unexpected SDK archive. Expected $env:OBS_SDK_SHA256, received $actualHash."
          }

          Write-Host "Validated exact SDK archive: $actualHash"
          "archive-path=$($archive.FullName)" >> $env:GITHUB_OUTPUT

      - name: Configure Castor Engine
        shell: pwsh
        run: |
          cmake --preset windows-x64 `
            "-DCASTOR_OBS_SDK_ARCHIVE_PATH=${{ steps.sdk.outputs['archive-path'] }}"

      - name: Build Castor Engine
        run: cmake --build --preset windows-x64-release

      - name: Install Castor Engine runtime
        run: >
          cmake --install build/windows-x64
          --config Release
          --prefix artifacts/runtime/win-x64

      - name: Verify libobs linkage
        shell: pwsh
        run: |
          $host = "artifacts/runtime/win-x64/bin/Castor.Engine.Host.dll"

          if (!(Test-Path -LiteralPath $host -PathType Leaf)) {
            throw "Castor.Engine.Host.dll was not installed."
          }

          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio/Installer/vswhere.exe"

          $visualStudioRoot = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if ([string]::IsNullOrWhiteSpace($visualStudioRoot)) {
            throw "Visual Studio C++ tools were not found."
          }

          $msvcRoot = Get-ChildItem `
            -LiteralPath "$visualStudioRoot/VC/Tools/MSVC" `
            -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          $dumpbin = Join-Path `
            $msvcRoot.FullName `
            "bin/Hostx64/x64/dumpbin.exe"

          if (!(Test-Path -LiteralPath $dumpbin -PathType Leaf)) {
            throw "dumpbin.exe was not found: $dumpbin"
          }

          $dependencies = & $dumpbin /dependents $host | Out-String
          Write-Host $dependencies

          if ($dependencies -notmatch '(?im)^\s*obs\.dll\s*$') {
            throw "Castor.Engine.Host.dll is not linked to obs.dll."
          }

      - name: Restore managed projects
        run: dotnet restore Castor.Engine.Tests/Castor.Engine.Tests.csproj

      - name: Build managed projects
        run: >
          dotnet build Castor.Engine.Tests/Castor.Engine.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run integration tests
        run: >
          dotnet test Castor.Engine.Tests/Castor.Engine.Tests.csproj
          --configuration Release
          --no-build
